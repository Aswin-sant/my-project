[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-system-diagnostic-tool"
version = "1.0.0"
description = "A beginner-friendly command-line tool for basic machine diagnostics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Student Developer" }]
dependencies = []

[project.scripts]
machine-diagnostic = "machine_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
